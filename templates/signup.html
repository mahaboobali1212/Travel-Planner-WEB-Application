{% extends 'base.html' %}
{% block title %}Sign Up · Travel Planner{% endblock %}
{% block content %}
<style>
  body, html {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 0;
  }

  .signup-container {
    display: flex;
    height: 100vh;
    justify-content: flex-end; /* Align box to right */
    align-items: center;
    padding-right: 50px;
  }

  .card {
    width: 550px; /* Rectangle box */
    padding: 70px 50px; /* Extra padding for big content */
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    background: #ffffff;
  }

  .card-body h3 {
    font-size: 3rem; /* Extra big heading */
    margin-bottom: 40px;
    color: #4e54c8;
    text-align: left;
  }

  .form-label {
    font-weight: 700;
    font-size: 1.6rem; /* Big labels */
  }

  .form-control {
    height: 65px; /* Big input boxes */
    font-size: 1.4rem;
    padding: 15px 20px;
    margin-bottom: 30px;
    border-radius: 12px;
    border: 1px solid #ccc;
    transition: all 0.3s ease;
  }

  .form-control:focus {
    border-color: #4e54c8;
    box-shadow: 0 0 15px rgba(78,84,200,0.3);
    outline: none;
  }

  .btn-success {
    background: #4e54c8;
    border: none;
    font-size: 1.6rem; /* Big button text */
    padding: 18px;
    border-radius: 50px;
    width: 100%;
    transition: all 0.3s ease;
  }

  .btn-success:hover {
    background: #8f94fb;
  }

  p {
    font-size: 1.4rem; /* Big paragraph */
    text-align: left;
    margin-top: 25px;
  }

  a {
    color: #4e54c8;
    font-weight: 700;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  @media(max-width: 768px){
    .signup-container {
      justify-content: center;
      padding-right: 20px;
    }

    .card {
      width: 90%;
      padding: 50px 30px;
    }

    .card-body h3 {
      font-size: 2.5rem;
    }

    .form-label {
      font-size: 1.4rem;
    }

    .form-control {
      height: 55px;
      font-size: 1.2rem;
    }

    .btn-success {
      font-size: 1.4rem;
      padding: 16px;
    }

    p {
      font-size: 1.2rem;
    }
  }
</style>

<div class="signup-container">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="mb-3">Create Account</h3>
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm" class="form-control" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Sign Up</button>
      </form>
      <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
