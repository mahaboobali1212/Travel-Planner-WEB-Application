{% extends 'base.html' %}
{% block title %}Login · Travel Planner{% endblock %}
{% block content %}
<div class="row align-items-center" style="min-height: calc(100vh - 140px); padding: 15px 0;">
  <div class="col-lg-5 col-md-7 col-12 d-flex justify-content-start">
    <div class="card shadow-lg p-4" 
         style="border-radius: 1.25rem; max-width: 480px; width: 100%;">
      <div class="card-body">
        <h2 class="mb-3 text-primary fw-bold" style="letter-spacing: 0.5px; font-size: 1.75rem;">Welcome Back ✈️</h2>
        <p class="text-muted mb-3" style="font-size: 1rem;">
          Log in to continue planning your amazing trips.
        </p>

        <form method="POST" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" 
                   style="font-size: 1.05rem; font-family: 'Poppins', sans-serif;">Username</label>
            <input name="username" class="form-control" 
                   placeholder="Enter your username" required
                   style="font-size: 1rem; font-family: 'Poppins', sans-serif; height: 46px; border-radius: 0.6rem;">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" 
                   style="font-size: 1.05rem; font-family: 'Poppins', sans-serif;">Password</label>
            <input type="password" name="password" class="form-control" 
                   placeholder="Enter your password" required
                   style="font-size: 1rem; font-family: 'Poppins', sans-serif; height: 46px; border-radius: 0.6rem;">
          </div>
          <button class="btn btn-primary w-100 btn-lg mt-2" type="submit" 
                  style="font-size: 1.1rem; font-weight: 600; padding: 12px; border-radius: 0.8rem;">
            Log In
          </button>
        </form>

        <p class="mt-4 mb-0 text-muted" style="font-size: 0.95rem;">
          New here? <a href="{{ url_for('signup') }}" class="fw-bold text-decoration-none">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
