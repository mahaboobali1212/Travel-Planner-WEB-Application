{% extends 'base.html' %}
{% block title %}Sign Up · Travel Planner{% endblock %}
{% block content %}
<style>
  .signup-container {
    display: flex;
    min-height: calc(100vh - 140px);
    justify-content: flex-end;
    align-items: center;
    padding: 20px 50px 20px 0;
  }

  .signup-card {
    width: 480px;
    padding: 35px 35px;
    border-radius: 1.25rem;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    background: #ffffff;
  }

  .signup-card h3 {
    font-size: 1.85rem;
    font-weight: 700;
    margin-bottom: 25px;
    color: #4e54c8;
    text-align: left;
  }

  .signup-card .form-label {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 6px;
  }

  .signup-card .form-control {
    height: 46px;
    font-size: 1rem;
    padding: 10px 15px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #ced4da;
    transition: all 0.3s ease;
  }

  .signup-card .form-control:focus {
    border-color: #4e54c8;
    box-shadow: 0 0 10px rgba(78,84,200,0.25);
    outline: none;
  }

  .signup-card .btn-success {
    background: #4e54c8;
    border: none;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 12px;
    border-radius: 30px;
    width: 100%;
    transition: all 0.3s ease;
  }

  .signup-card .btn-success:hover {
    background: #6c72e2;
  }

  .signup-card p {
    font-size: 0.95rem;
    text-align: left;
    margin-top: 18px;
  }

  .signup-card a {
    color: #4e54c8;
    font-weight: 700;
    text-decoration: none;
  }

  .signup-card a:hover {
    text-decoration: underline;
  }

  @media(max-width: 768px){
    .signup-container {
      justify-content: center;
      padding: 15px 0;
    }

    .signup-card {
      width: 100%;
      max-width: 440px;
      padding: 25px 20px;
    }
  }
</style>

<div class="signup-container">
  <div class="signup-card shadow-sm">
    <div class="card-body">
      <h3>Create Account</h3>
      <form method="POST" novalidate>
        <div class="mb-2">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" placeholder="Choose a username" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="confirm" class="form-control" placeholder="Re-enter password" required>
        </div>
        <button class="btn btn-success w-100 mt-2" type="submit">Sign Up</button>
      </form>
      <p class="mt-3 mb-0 text-muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
